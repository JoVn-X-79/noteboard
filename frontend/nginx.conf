# nginx configuration for Noteboard frontend
# Serves static files and proxies /api/ to the backend service

server {
    listen 80;
    server_name _;

    # Serve static files from /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/ requests to the backend Kubernetes service
    # backend-service resolves via internal Kubernetes DNS
    location /api/ {
        proxy_pass         http://backend-service:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Serve index.html for all other paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
