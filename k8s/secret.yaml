# Secret: sensitive database credentials (base64-encoded, not plaintext)
# Never commit real production credentials — use a secrets manager in production
apiVersion: v1
kind: Secret
metadata:
  name: noteboard-secret
  labels:
    app: noteboard
type: Opaque
data:
  # echo -n "nbuser" | base64
  DB_USER: bmJ1c2Vy
  # echo -n "nbpassword123" | base64
  DB_PASSWORD: bmJwYXNzd29yZDEyMw==
  # echo -n "nbpassword123" | base64  (used by postgres POSTGRES_PASSWORD)
  POSTGRES_PASSWORD: bmJwYXNzd29yZDEyMw==
